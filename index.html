<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Texture Pack Downloads</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Custom Textures</h1>
        <p>Download my latest textures below.</p>
        <input type="text" id="searchInput" placeholder="Search for a texture (e.g., stone, wood)...">
    </header>

    <main>
        <div id="textureGrid" class="texture-grid"></div>
        <p id="noResults" class="hidden">No textures found matching your search.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
