<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.T</title>

<style>
    * { box-sizing: border-box; }

    body {
        background-color: #111;
        color: white;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding-bottom: 40px;
    }

    h1 {
        text-align: center;
        padding-top: 30px;
    }

    #searchBar {
        display: block;
        width: 80%;
        max-width: 500px;
        margin: 20px auto;
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #444;
        background-color: #222;
        color: white;
    }

    #searchBar::placeholder {
        color: #aaa;
    }

    #noResults {
        text-align: center;
        color: #888;
        display: none;
        margin-top: 20px;
    }

    .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 20px;
        max-width: 1100px;
        margin: 0 auto;
    }

    .item {
        background-color: #1c1c1c;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        border: 1px solid #333;
    }

    .item h2 {
        margin: 4px 0 12px;
        font-size: 18px;
    }

    .item img {
        width: 100%;
        max-width: 250px;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 8px;
        background-color: #333;
    }

    .item button {
        margin-top: 12px;
        padding: 8px 20px;
        border-radius: 6px;
        border: none;
        background-color: #3a7bd5;
        color: white;
        font-size: 14px;
        cursor: pointer;
        box-shadow:0 8px 16px 0 rgba(0,0,0,0.6)
    }

    .item button:hover {
        background-color: #2f65b0;
    }

    .item a {
        text-decoration: none;
    }

    footer {
        text-align: center;
        margin-top: 30px;
    }

    footer a {
        color: #7db1ff;
    }
</style>


</head>

<body>

<h1>Textures</h1>

<input
    type="text"
    id="searchBar"
    placeholder="Search textures..."
    oninput="filterTextures()"
>

<div class="grid-container" id="grid">
    <div class="item" data-name="lava">
        <h2>Lava</h2>
        <img src="Lava/Preview.png" alt="Lava texture preview">
        <a href="Lava.zip"><button>Download</button></a>
    </div>
    <div class="item" data-name="ice">
        <h2>Ice</h2>
        <img src="Ice/Preview.png" alt="Ice texture preview">
        <a href="Ice.zip"><button>Download</button></a>
    </div>

</div>

<p id="noResults">No textures match your search.</p>

<footer>
    <a href="https://creativecommons.org/publicdomain/zero/1.0/legalcode.en">Texture Licenses</a>
</footer>

<script>
function filterTextures() {
    const query = document.getElementById('searchBar').value.trim().toLowerCase();
    const items = document.querySelectorAll('.item');
    let anyVisible = false;

    items.forEach(item => {
        const name = item.dataset.name;
        const match = name.includes(query);
        item.style.display = match ? 'flex' : 'none';
        if (match) anyVisible = true;
    });

    document.getElementById('noResults').style.display = anyVisible ? 'none' : 'block';
}
</script>

</body>
</html>
