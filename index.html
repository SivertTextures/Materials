<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Free PBR Texture Library</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <p class="eyebrow">CC0 · Free to use</p>
    <h1>Texture Library</h1>
    <p class="subhead"><span id="count">0</span> materials, PBR ready</p>

    <div class="search-wrap">
        <span class="search-prompt">&gt;</span>
        <label for="searchBar" class="search-label">Search textures</label>
        <input type="text" id="searchBar" placeholder="search by name or map type…">
    </div>
</header>

<div class="grid-container" id="grid"></div>

<p id="noResults">No matches. Try a different material or map type.</p>

<footer>
    <a href="https://creativecommons.org/publicdomain/zero/1.0/legalcode.en">Texture Licenses</a>
</footer>

<script src="textures.js"></script>
<script src="script.js"></script>

</body>
</html>
